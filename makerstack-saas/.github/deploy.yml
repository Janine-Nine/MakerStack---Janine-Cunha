name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📦 Install PNPM
        run: npm install -g pnpm

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🔍 Lint
        run: pnpm lint
        continue-on-error: true

      - name: 🏗 Build Frontend (makerstack-saas)
        run: cd makerstack-saas && pnpm build

      - name: 🧪 Tests
        run: pnpm test
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install PNPM
        run: npm install -g pnpm

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🏗 Build
        run: cd makerstack-saas && pnpm build

      - name: 🚀 Deploy to Vercel
        uses: vercel/action@v5
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
