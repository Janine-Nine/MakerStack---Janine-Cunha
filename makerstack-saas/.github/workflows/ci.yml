name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 📦 Install PNPM
        run: npm install -g pnpm

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🧪 Lint
        run: pnpm lint || echo "No lint configured"

      - name: 🧪 Tests
        run: pnpm test || echo "No tests configured"

      - name: 🏗 Build
        run: pnpm build